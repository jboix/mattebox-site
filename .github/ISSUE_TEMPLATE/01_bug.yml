name: 🐛 Bug Report
description: Report a possible bug or regression
title: "🐛 <TITLE>"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Please provide a clear and concise
        description of what the bug is; reports that cannot be reproduced
        take much longer to fix.
  - type: textarea
    id: environment
    attributes:
      label: Environment information
      description: >
        Paste the browser (with OS version) where the bug occurs, and
        whether it is the hosted page or a checkout (`node --version`). If
        the bug involves a theme, a share link that reproduces it is the
        best report. Review it for anything sensitive before posting.
      value: |
        <details>

        ```
        Paste output here
        ```

        </details>
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: What happened?
      description: >
        Provide the steps that reproduce the issue: the preset, the edit,
        the stream, the dock. The more complete the steps, the quicker the
        report can be triaged and addressed.
      placeholder: |
        1.
        2.
    validations:
      required: true
  - type: textarea
    id: expected-result
    attributes:
      label: Expected result
      description: Describe what you expected to happen.
      placeholder: The preview should follow the stylesheet edit.
    validations:
      required: true
  - type: checkboxes
    id: coc
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our [Code of Conduct](https://github.com/jboix/mattebox-site/blob/main/docs/CODE_OF_CONDUCT.md)
      options:
        - label: I agree to follow the Mattebox site's Code of Conduct
          required: true
