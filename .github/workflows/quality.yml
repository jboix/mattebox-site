name: Quality

on:
  merge_group:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: '.tool-versions'
      - name: Install dependencies
        env:
          HUSKY: '0'
        run: bun install --frozen-lockfile
      # Every step is a package script, the same ones `bun run verify` chains,
      # so the hook and CI cannot drift apart.
      - name: Lint and format
        run: bun run lint
      - name: Docs format and links
        run: bun run docs:check
      - name: Dead code
        run: bun run knip
      - name: Tests
        run: bun run test
      # The build clones the product repositories, collects the docs, builds
      # the pages, and checks every link and every page's head.
      - name: Build
        run: bun run build
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      # axe-core over every built page, in the light and the dark theme.
      - name: Accessibility
        run: bun run check:a11y
      - name: Typecheck
        run: bun run typecheck

  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: '.tool-versions'
      - name: Install dependencies
        env:
          HUSKY: '0'
        run: bun install --frozen-lockfile
      - name: Lint commit messages (Conventional Commits)
        run: bunx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  # The ruleset on main requires a check named `quality`, and Actions reports
  # per job, so this job is the one name that stands for the whole workflow.
  # commitlint is skipped outside pull requests, so a skipped dependency
  # counts as passing; only a failure or a cancellation fails it.
  quality:
    if: always()
    needs: [verify, commitlint]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail when a required job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
